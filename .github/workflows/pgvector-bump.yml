# Watches upstream pgvector releases. When a newer one is out (and upstream
# has published images for our Postgres majors), it bumps PGVECTOR_VERSION,
# commits to main and starts build-and-push.yml, which republishes every tag
# and then the pgBackRest variant. Hands-off: no PR to merge.
#
# Commits made with GITHUB_TOKEN do not trigger other workflows, so the build
# is started explicitly with `gh workflow run`.
name: pgvector version bump

on:
  schedule:
    - cron: "30 2 * * 0"  # every Sunday
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest upstream pgvector release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/pgvector/pgvector/releases/latest --jq .tag_name)
          ver="${tag#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "latest upstream pgvector: $ver"

      - name: Compare with Dockerfile default
        id: check
        run: |
          set -euo pipefail
          current=$(grep -E '^ARG PGVECTOR_VERSION=' Dockerfile.pgvector | cut -d= -f2)
          latest="${{ steps.upstream.outputs.version }}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "current=$current latest=$latest"
          if [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -1)" = "$latest" ] \
            && [ "$current" != "$latest" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      # Upstream publishes one image per Postgres major and a major can lag a
      # release by hours. Bump only once every major we build has an image;
      # otherwise wait for next week rather than break a tag.
      - name: Verify upstream images exist for every major we build
        if: steps.check.outputs.bump == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.upstream.outputs.version }}"
          for major in $(cat PG_MAJORS); do
            if ! curl -fsSL "https://hub.docker.com/v2/repositories/pgvector/pgvector/tags/${ver}-pg${major}" -o /dev/null; then
              echo "::warning::pgvector/pgvector:${ver}-pg${major} is not published yet; trying again next week"
              exit 1
            fi
          done

      - name: Commit the bump and start the build
        if: steps.check.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="${{ steps.check.outputs.current }}"
          latest="${{ steps.upstream.outputs.version }}"
          sed -i "s/^ARG PGVECTOR_VERSION=.*/ARG PGVECTOR_VERSION=${latest}/" Dockerfile.pgvector
          sed -i "s/${current//./\\.}/${latest}/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile.pgvector README.md
          git commit -m "Bump pgvector ${current} -> ${latest}"
          git push origin HEAD:main
          gh workflow run build-and-push.yml --ref main
