# Builds and publishes the pgBackRest variant to GHCR as
# ghcr.io/saiakashneela/pgvector-ssl-pgbackrest. It is layered on the
# published pgvector-ssl image, so it rebuilds whenever that image is
# republished (workflow_run) as well as when its own files change.
# Tags mirror the base image: <pgvector>-pg<major>, pg<major>, and `latest`
# on the default major.
name: build and push pgbackrest

on:
  push:
    branches: [main]
    paths:
      - "pgbackrest/**"
      - ".github/workflows/build-pgbackrest.yml"
  workflow_run:
    workflows: ["build and push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: ghcr.io/saiakashneela/pgvector-ssl
  REGISTRY_IMAGE: ghcr.io/saiakashneela/pgvector-ssl-pgbackrest
  DEFAULT_PG_MAJOR: "17"

jobs:
  build:
    # After a base build, only go ahead if it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_major: [16, 17, 18]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: meta
        run: |
          set -euo pipefail
          ver=$(grep -E '^ARG PGVECTOR_VERSION=' Dockerfile.pgvector | cut -d= -f2)
          {
            echo "version=$ver"
            echo "tags<<EOF"
            echo "${REGISTRY_IMAGE}:${ver}-pg${{ matrix.pg_major }}"
            echo "${REGISTRY_IMAGE}:pg${{ matrix.pg_major }}"
            if [ "${{ matrix.pg_major }}" = "$DEFAULT_PG_MAJOR" ]; then
              echo "${REGISTRY_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: pgbackrest
          file: pgbackrest/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Pull the base fresh: it may have been republished seconds ago.
          pull: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            PG_MAJOR=${{ matrix.pg_major }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=pgvector-ssl (PostgreSQL ${{ matrix.pg_major }} + pgvector ${{ steps.meta.outputs.version }}, self-signed SSL) with pgBackRest and jq
          tags: ${{ steps.meta.outputs.tags }}
