# Builds and publishes the pgBackRest variants to GHCR:
#   pgvector-ssl-pgbackrest - on the published pgvector-ssl image
#   postgres-ssl-pgbackrest - on the published postgres-ssl image
# Only build-and-push.yml starts it (after every base build, including when
# pgbackrest/ changes), so it always builds on the base images just published;
# a push trigger of its own would race the base build. Tags mirror the base image: <pgvector>-pg<major> (pgvector
# only), pg<major>, and `latest` on the default major, for each major in
# PG_MAJORS.
name: build and push pgbackrest

on:
  workflow_dispatch:

# One build at a time, in order, so an older build can never finish last and
# point a floating tag back at older images.
concurrency:
  group: build-pgbackrest
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/saiakashneela
  DEFAULT_PG_MAJOR: "17"

jobs:
  majors:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "list=$(jq -cR 'split(" ") | map(select(length > 0))' < <(tr -s ' \n' ' ' < PG_MAJORS))" >> "$GITHUB_OUTPUT"

  build:
    needs: majors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_major: ${{ fromJSON(needs.majors.outputs.list) }}
        flavor: [pgvector, postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: meta
        run: |
          set -euo pipefail
          ver=$(grep -E '^ARG PGVECTOR_VERSION=' Dockerfile.pgvector | cut -d= -f2)
          major="${{ matrix.pg_major }}"
          if [ "${{ matrix.flavor }}" = "pgvector" ]; then
            base="${REGISTRY}/pgvector-ssl"
            desc="pgvector-ssl (PostgreSQL ${major} + pgvector ${ver}, self-signed SSL) with pgBackRest and jq"
          else
            base="${REGISTRY}/postgres-ssl"
            desc="postgres-ssl (PostgreSQL ${major}, self-signed SSL) with pgBackRest and jq"
          fi
          image="${base}-pgbackrest"
          {
            echo "base=$base"
            echo "desc=$desc"
            echo "tags<<EOF"
            [ "${{ matrix.flavor }}" = "pgvector" ] && echo "${image}:${ver}-pg${major}"
            echo "${image}:pg${major}"
            if [ "$major" = "$DEFAULT_PG_MAJOR" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: pgbackrest
          file: pgbackrest/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Pull the base fresh: it may have been republished seconds ago.
          pull: true
          no-cache: true
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base }}
            PG_MAJOR=${{ matrix.pg_major }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ steps.meta.outputs.desc }}
          tags: ${{ steps.meta.outputs.tags }}
