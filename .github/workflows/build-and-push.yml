# Builds and publishes the images to GHCR: on every merge to main, every
# Monday (so Postgres patch releases and Debian security fixes land even when
# nothing in this repo changed), and when another workflow dispatches it
# (the pgvector bump and the Postgres major check do).
# Two images from Dockerfile.pgvector, per Postgres major:
#   pgvector-ssl  - FROM pgvector/pgvector; tags <pgvector>-pg<major>, pg<major>
#   postgres-ssl  - FROM the official postgres image (no pgvector); tag pg<major>
# plus `latest` on the default major. The majors built are the ones listed in
# PG_MAJORS.
name: build and push

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.pgvector"
      - "*.sh"
      - "PG_MAJORS"
      - ".github/workflows/build-and-push.yml"
  schedule:
    - cron: "0 4 * * 1"  # every Monday, after Sunday's version checks
  workflow_dispatch:

# One build at a time, in order, so an older build can never finish last and
# point a floating tag back at older images.
concurrency:
  group: build-and-push
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: write  # to start the pgBackRest variant's build afterwards

env:
  REGISTRY: ghcr.io/saiakashneela
  DEFAULT_PG_MAJOR: "17"

jobs:
  majors:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "list=$(jq -cR 'split(" ") | map(select(length > 0))' < <(tr -s ' \n' ' ' < PG_MAJORS))" >> "$GITHUB_OUTPUT"

  build:
    needs: majors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_major: ${{ fromJSON(needs.majors.outputs.list) }}
        flavor: [pgvector, postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: meta
        run: |
          set -euo pipefail
          ver=$(grep -E '^ARG PGVECTOR_VERSION=' Dockerfile.pgvector | cut -d= -f2)
          major="${{ matrix.pg_major }}"
          if [ "${{ matrix.flavor }}" = "pgvector" ]; then
            image="${REGISTRY}/pgvector-ssl"
            base="pgvector/pgvector:${ver}-pg${major}"
            desc="PostgreSQL ${major} + pgvector ${ver}, self-signed SSL, vector enabled in every database"
          else
            image="${REGISTRY}/postgres-ssl"
            base="postgres:${major}-bookworm"
            desc="PostgreSQL ${major}, self-signed SSL"
          fi
          {
            echo "version=$ver"
            echo "base=$base"
            echo "desc=$desc"
            echo "tags<<EOF"
            [ "${{ matrix.flavor }}" = "pgvector" ] && echo "${image}:${ver}-pg${major}"
            echo "${image}:pg${major}"
            if [ "$major" = "$DEFAULT_PG_MAJOR" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pgvector
          platforms: linux/amd64,linux/arm64
          push: true
          # Always start from the newest upstream base and a fresh apt index.
          pull: true
          no-cache: true
          build-args: |
            PGVECTOR_VERSION=${{ steps.meta.outputs.version }}
            PG_MAJOR=${{ matrix.pg_major }}
            BASE_IMAGE=${{ steps.meta.outputs.base }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ steps.meta.outputs.desc }}
          tags: ${{ steps.meta.outputs.tags }}

  # The pgBackRest variants are layered on these images; rebuild them on top.
  pgbackrest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-pgbackrest.yml --repo "${{ github.repository }}" --ref main
